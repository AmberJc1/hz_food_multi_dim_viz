<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>杭州餐饮商家地图 · 实时导航</title>
<style>
html,body,#map{height:100%;margin:0}body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fb}
.panel{position:absolute;z-index:1000;top:16px;left:16px;width:350px;max-height:calc(100vh - 32px);overflow:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:16px;padding:16px;box-shadow:0 8px 30px #0002}
h2{margin:0 0 8px;font-size:20px}.tip{font-size:12px;color:#666;line-height:1.6}.row{margin-top:10px}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #ccc;background:#fff}button{background:#1677ff;color:#fff;border:0;margin-top:8px;cursor:pointer;font-weight:600}.secondary{background:#666}.navbtn{background:#10a37f}.stopbtn{background:#e53935}
.result{display:none;margin-top:10px;padding:10px;background:#f5f6f8;border-radius:8px;font-size:13px;line-height:1.7}.nav-status{display:none;margin-top:10px;padding:12px;border-radius:10px;background:linear-gradient(135deg,#eef8ff,#f4fff8);border:1px solid #dbeeff}.nav-status .big{font-size:18px;font-weight:700;margin-bottom:3px}.nav-status .small{font-size:12px;color:#666}
.popup{width:310px;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 8px 30px #0003}.popup-hero{position:relative;height:82px;padding:14px 16px;box-sizing:border-box;color:#fff;background:linear-gradient(135deg,#ff9a62 0%,#ff5d62 48%,#8b6cff 100%)}.popup-hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 25%,#fff6 0 2px,transparent 3px),radial-gradient(circle at 72% 70%,#fff4 0 3px,transparent 4px),radial-gradient(circle at 25% 35%,#fff3 0 2px,transparent 3px);opacity:.8}.popup-hero h3{position:relative;z-index:1;margin:0;font-size:18px;line-height:1.35;text-shadow:0 1px 3px #0003}.popup-hero .sub{position:relative;z-index:1;margin-top:4px;font-size:11px;opacity:.92}.popup-body{padding:12px 14px;background:linear-gradient(180deg,#fff 0%,#fffaf7 100%)}.popup table{width:100%;font-size:12px;border-collapse:collapse}.popup td{padding:5px 3px;border-bottom:1px solid #f0e8e4;vertical-align:top}.popup td:first-child{font-weight:bold;white-space:nowrap;color:#555;width:72px}.dest{background:#1677ff;color:#fff;border:0;padding:8px 10px;border-radius:7px;margin-top:10px}.location-badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#fff5;color:#fff;font-size:11px}
.legend{margin-top:12px;font-size:11px;color:#666}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.blue{background:#1677ff}.red{background:#e53935}.purple{background:#7b1fa2}
@media(max-width:700px){.panel{left:10px;right:10px;width:auto;top:10px;max-height:55vh}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h2>杭州餐饮商家地图</h2>
<div class="tip">打开网页后自动获取用户当前位置。选择商家后可规划路线；点击“开始实时导航”后，系统会持续获取当前位置、更新地图上的用户位置，并在移动或偏离路线时重新规划。</div>
<div class="row"><label>出行方式</label><select id="mode"><option value="driving">驾车</option><option value="walking">步行</option><option value="bicycling">骑行</option></select></div>
<div class="row"><label>当前位置 / 起点</label><div id="startText" class="tip">正在定位……</div></div>
<div class="row"><label>目的地</label><div id="endText" class="tip">尚未设置</div></div>
<button onclick="planRoute()">规划路线</button>
<button class="navbtn" onclick="startNavigation()">开始实时导航</button>
<button class="stopbtn" onclick="stopNavigation()">结束实时导航</button>
<button class="secondary" onclick="clearRoute()">清除路线</button>
<div id="navStatus" class="nav-status"><div id="navBig" class="big">未开始导航</div><div id="navSmall" class="small">请选择商家作为目的地</div></div>
<div id="result" class="result"></div>
<div class="legend"><span class="dot blue"></span>商家　<span class="dot red"></span>用户当前位置　<span class="dot purple"></span>目的地</div>
</div>
<script>
let map, shops=[], start=null,end=null,startMarker=null,endMarker=null,routeService=null;
let watchId=null,navigating=false,lastRerouteAt=0,lastRouteOrigin=null,positionQueueBusy=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function popup(shop){
  let r='';
  if(shop.cost!=null)r+=`<tr><td>人均消费</td><td>¥${esc(shop.cost)}</td></tr>`;
  if(shop.rating!=null)r+=`<tr><td>评分</td><td>⭐ ${esc(shop.rating)}</td></tr>`;
  if(shop.category)r+=`<tr><td>餐饮品类</td><td>${esc(shop.category)}</td></tr>`;
  if(shop.district)r+=`<tr><td>所属区域</td><td>${esc(shop.district)}</td></tr>`;
  if(shop.address)r+=`<tr><td>地址</td><td>${esc(shop.address)}</td></tr>`;
  if(shop.tel)r+=`<tr><td>电话</td><td>${esc(shop.tel)}</td></tr>`;
  const safeName=esc(shop.name||'该商家').replace(/'/g,"\\'");
  return `<div class="popup"><div class="popup-hero"><h3>${esc(shop.name||'餐饮商家')}</h3><div class="sub">杭州餐饮商家 · <span class="location-badge">商家详情</span></div></div><div class="popup-body"><table>${r}</table><button class="dest" onclick="setDestination(${shop.lng},${shop.lat},'${safeName}')">设为目的地</button></div></div>`;
}
async function init(){
  const cfg=await fetch('/api/config').then(r=>r.json());
  if(!cfg.js_key)throw Error('未配置高德 JS API Key');
  if(cfg.security_code)window._AMapSecurityConfig={securityJsCode:cfg.security_code};
  const s=document.createElement('script');
  s.src=`https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(cfg.js_key)}`;
  s.onload=startMap;s.onerror=()=>alert('高德 JS API 加载失败，请检查 JS Key、Security Code 和域名白名单。');
  document.head.appendChild(s);
}
async function startMap(){
  map=new AMap.Map('map',{zoom:12,center:[120.1551,30.2741],viewMode:'2D'});
  map.on('click',e=>{if(!navigating)setStart(e.lnglat.getLng(),e.lnglat.getLat(),'手动选择起点');});
  shops=await fetch('/api/shops').then(r=>r.json());
  shops.forEach(shop=>{
    const m=new AMap.CircleMarker({center:[shop.lng,shop.lat],radius:4,strokeColor:'#1677ff',strokeWeight:1,fillColor:'#1677ff',fillOpacity:.75});
    m.setMap(map);
    m.on('click',()=>{const iw=new AMap.InfoWindow({isCustom:true,offset:new AMap.Pixel(0,-8),content:popup(shop)});iw.open(map,m.getCenter());});
  });
  locateUser();
}
function locateUser(){
  $('startText').textContent='正在获取您的当前位置……';
  AMap.plugin('AMap.Geolocation',function(){
    const geolocation=new AMap.Geolocation({enableHighAccuracy:true,timeout:10000,maximumAge:0,convert:true,showButton:false,showMarker:false,showCircle:false,GeoLocationFirst:true});
    geolocation.getCurrentPosition(function(status,result){
      if(status==='complete' && result.position){
        const lng=result.position.lng,lat=result.position.lat;
        setStart(lng,lat,'用户当前位置');map.setCenter([lng,lat]);
        if(map.getZoom()<12)map.setZoom(12);
        $('startText').textContent='已定位到用户当前位置';
      }else $('startText').textContent='定位失败，请允许浏览器定位或点击地图手动设置起点';
    });
  });
}
function setStart(lng,lat,label='用户当前位置'){
  start={lng:Number(lng),lat:Number(lat)};
  if(startMarker)startMarker.setPosition([start.lng,start.lat]);
  else {startMarker=new AMap.Marker({position:[start.lng,start.lat],content:'<div style="background:#e53935;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px #0003">起</div>',offset:new AMap.Pixel(-12,-12)});startMarker.setMap(map);}
  $('startText').textContent=label;
}
function setDestination(lng,lat,name){
  end={lng:Number(lng),lat:Number(lat),name:name};
  if(endMarker)endMarker.setPosition([end.lng,end.lat]);
  else {endMarker=new AMap.Marker({position:[end.lng,end.lat],content:'<div style="background:#7b1fa2;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px #0003">终</div>',offset:new AMap.Pixel(-12,-12)});endMarker.setMap(map);}
  $('endText').textContent=name;
  if(start)planRoute();
}
function makeRouteService(mode){
  if(mode==='driving')return new AMap.Driving({map:map,policy:AMap.DrivingPolicy.LEAST_TIME});
  if(mode==='walking')return new AMap.Walking({map:map});
  return new AMap.Riding({map:map});
}
function clearRouteOnly(){
  if(routeService&&routeService.clear)routeService.clear();
  routeService=null;
}
function planRoute(){
  if(!start)return alert('正在获取用户位置，请稍候；如果定位失败，请点击地图手动设置起点。');
  if(!end)return alert('请先选择商家作为目的地。');
  const result=$('result');result.style.display='block';result.textContent='正在规划路线……';
  clearRouteOnly();
  const mode=$('mode').value;
  AMap.plugin(['AMap.Driving','AMap.Walking','AMap.Riding'],function(){
    try{
      routeService=makeRouteService(mode);
      routeService.search([start.lng,start.lat],[end.lng,end.lat],function(status,data){
        if(status==='complete'){
          const path=data&&data.routes&&data.routes[0];
          if(!path){result.innerHTML='<span style="color:#d32f2f">规划失败：没有找到可用路线</span>';return;}
          const distance=Number(path.distance||0),duration=Number(path.time||path.duration||0);
          result.innerHTML=`<b>路线规划完成</b><br>出行方式：${({driving:'驾车',walking:'步行',bicycling:'骑行'})[mode]}<br>距离：${(distance/1000).toFixed(2)} km<br>预计时间：${Math.ceil(duration/60)} 分钟`;
          lastRouteOrigin={lng:start.lng,lat:start.lat};lastRerouteAt=Date.now();
        }else result.innerHTML='<span style="color:#d32f2f">规划失败：'+esc((data&&data.info)||'高德路线服务返回失败')+'</span>';
      });
    }catch(e){result.innerHTML='<span style="color:#d32f2f">规划失败：'+esc(e.message)+'</span>';}
  });
}
function updateNavStatus(text,sub){$('navStatus').style.display='block';$('navBig').textContent=text;$('navSmall').textContent=sub||'';}
function startNavigation(){
  if(!end)return alert('请先点击一个商家并设为目的地。');
  if(!navigator.geolocation)return alert('当前浏览器不支持实时定位。');
  if(navigating)return;
  navigating=true;updateNavStatus('正在启动实时导航…','请保持浏览器定位权限开启');
  $('startText').textContent='正在持续获取当前位置';
  navigator.geolocation.getCurrentPosition(handleBrowserPosition,handleGeoError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  watchId=navigator.geolocation.watchPosition(handleBrowserPosition,handleGeoError,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
function stopNavigation(){
  navigating=false;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  updateNavStatus('已结束实时导航','如需继续，请重新点击“开始实时导航”');
}
function handleGeoError(err){
  if(!navigating)return;
  updateNavStatus('定位暂时失败',`请检查浏览器定位权限（${err.message||'未知错误'}）`);
}
function handleBrowserPosition(pos){
  if(!navigating)return;
  const gps=[pos.coords.longitude,pos.coords.latitude];
  // 浏览器 GPS 一般是 WGS84，高德地图使用 GCJ-02，因此先转换。
  AMap.convertFrom(gps,'gps',function(status,res){
    if(status!=='complete'||!res.locations||!res.locations[0]){
      updateNavStatus('定位转换失败','无法把 GPS 坐标转换为高德坐标');return;
    }
    const p=res.locations[0];const lng=p.lng,lat=p.lat;
    setStart(lng,lat,'用户实时位置');
    map.panTo([lng,lat]);
    const acc=pos.coords.accuracy?Math.round(pos.coords.accuracy):null;
    updateNavStatus('导航进行中',`当前位置已更新${acc?` · 定位精度约 ${acc} 米`:''}`);
    if(end)maybeReroute(lng,lat);
  });
}
function maybeReroute(lng,lat){
  if(positionQueueBusy||!end)return;
  const now=Date.now();
  let moved=999999;
  if(lastRouteOrigin)moved=AMap.GeometryUtil.distance([lastRouteOrigin.lng,lastRouteOrigin.lat],[lng,lat]);
  // 移动约50米或超过10秒后重新规划，让路线跟随用户当前位置。
  if(moved<50 && now-lastRerouteAt<10000)return;
  positionQueueBusy=true;
  start={lng,lat};
  clearRouteOnly();
  const mode=$('mode').value;
  AMap.plugin(['AMap.Driving','AMap.Walking','AMap.Riding'],function(){
    routeService=makeRouteService(mode);
    routeService.search([lng,lat],[end.lng,end.lat],function(status,data){
      positionQueueBusy=false;
      if(status==='complete'){
        const path=data&&data.routes&&data.routes[0];
        if(path){
          lastRouteOrigin={lng,lat};lastRerouteAt=Date.now();
          const distance=Number(path.distance||0),duration=Number(path.time||path.duration||0);
          $('result').style.display='block';
          $('result').innerHTML=`<b>实时导航</b><br>剩余距离：${(distance/1000).toFixed(2)} km<br>预计剩余时间：${Math.ceil(duration/60)} 分钟`;
          if(distance<30){updateNavStatus('已接近目的地','你已经到达商家附近');}
        }
      }else updateNavStatus('路线更新失败','正在等待下一次定位后重试');
    });
  });
}
function clearRoute(){
  stopNavigation();clearRouteOnly();
  if(endMarker)endMarker.setMap(null);endMarker=null;end=null;
  $('endText').textContent='尚未设置';$('result').style.display='none';
  updateNavStatus('未开始导航','请选择商家作为目的地');
}
init().catch(e=>alert(e.message));
</script>
</body></html>
